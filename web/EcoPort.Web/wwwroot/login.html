<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · EcoBridge</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1f1f24;
            --muted: #62626d;
            --accent: #594ae2;
            --on-accent: #ffffff;
            --border: #dcdce3;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a27;
                --card: #27273a;
                --text: #ededf2;
                --muted: #a8a8b8;
                --accent: #8b80f0;
                --on-accent: #14141f;
                --border: #3a3a52;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font: 16px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        main {
            width: 100%;
            max-width: 360px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 28px 24px;
        }
        h1 { font-size: 1.4rem; margin: 0 0 4px; }
        p { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
        a.provider {
            display: block;
            padding: 10px 14px;
            margin-bottom: 10px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            color: var(--accent);
            text-decoration: none;
            text-align: center;
            font-weight: 500;
        }
        a.provider:hover, a.provider:focus-visible { background: var(--accent); color: var(--on-accent); }
        small { display: block; margin-top: 16px; color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <h1>EcoBridge</h1>
        <p>Sign in to see the bench dashboard.</p>
        <a class="provider" href="/.auth/login/aad?post_login_redirect_uri=/">Sign in with Microsoft</a>
        <a class="provider" href="/.auth/login/github?post_login_redirect_uri=/">Sign in with GitHub</a>
        <small>Access needs an invitation to the <code>bench</code> role. If you are signed in and still land here,
            ask for an invitation or <a href="/.auth/logout">sign out</a> and try another account.</small>
    </main>
</body>
</html>
