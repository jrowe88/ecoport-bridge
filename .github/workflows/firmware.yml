name: Firmware

on:
  push:
    branches:
      - main
    paths:
      - "firmware/**"
      - "captures/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "captures/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cta2045:
    name: cta2045 (host tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/cta2045
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/cta2045
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  ucm:
    name: ucm (ESP32-C6 build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/ucm
    env:
      # .cargo/config.toml sets a Windows-specific target dir; use the standard one here.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/ucm
      - name: Cache ESP-IDF and its tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: espressif-${{ runner.os }}-${{ hashFiles('firmware/ucm/.cargo/config.toml') }}
      - name: Install ldproxy
        run: cargo install ldproxy --locked
      - name: Use placeholder Wi-Fi credentials
        run: cp src/wifi_credentials.example.rs src/wifi_credentials.rs
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
