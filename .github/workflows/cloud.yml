name: Cloud

on:
  push:
    branches:
      - main
    paths:
      - "cloud/**"
      - "contracts/**"
      - ".github/workflows/cloud.yml"
  pull_request:
    paths:
      - "cloud/**"
      - "contracts/**"
      - ".github/workflows/cloud.yml"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build cloud/EcoPort.Cloud.slnx -c Release
      - run: dotnet test cloud/EcoPort.Cloud.slnx -c Release --no-build
