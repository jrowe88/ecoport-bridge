[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoport"
version = "0.1.0"
description = "CTA-2045 (EcoPort) protocol implementation and tooling for the EcoPort Bridge project"
readme = { text = "CTA-2045 (EcoPort) protocol implementation and tooling for EcoPort Bridge.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jim Rowe" }]
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
