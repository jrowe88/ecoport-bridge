[package]
name = "ucm"
version = "0.1.0"
authors = ["Jim Rowe"]
edition = "2021"
description = "EcoPort Bridge UCM firmware for the ESP32-C6 (Rust std on ESP-IDF)"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "ucm"
# The built-in test harness does not run on the device; disabling it also keeps
# rust-analyzer from reporting spurious errors. Host tests live in the cta2045 crate.
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true # Symbols are nice, and they don't increase the size on flash
opt-level = "z"

[dependencies]
anyhow = "1"
cta2045 = { path = "../cta2045" }
esp-idf-svc = { version = "0.53", features = ["critical-section"] }
log = "0.4"

[build-dependencies]
embuild = "0.33.5"

# The esp-rs crates are consumed from their combined git repository (as generated by
# esp-idf-template). The exact revision is pinned in Cargo.lock.
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf.git" }
